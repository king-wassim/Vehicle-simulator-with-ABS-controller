name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: plant/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plant/requirements.txt

      - name: Python — unit tests (protocol, CRC, framing)
        run: python -m unittest discover -s tests -v

      - name: Python — plant offline envelope check + plot
        # Validates the physics model: ~60 m without ABS, ~45 m with oracle,
        # within ±25 % envelope of the targets in docs/PHYSICS.md §5.
        # MPLBACKEND=Agg keeps matplotlib happy on headless runners.
        env:
          MPLBACKEND: Agg
        run: python -m plant.simulate

      - name: C — build with strict warnings
        run: make -C controller all CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -g"

      - name: C — CRC known-answer tests
        run: ./controller/build/test_crc

      - name: Integration — 1000-frame Plant↔ECU milestone
        # Python plant server in the background; C ping_client connects and
        # echoes. Threshold relaxed to 5 ms on noisy GitHub runners (loopback
        # mean is ~0.3 ms on dev workstation).
        run: |
          set -e
          python -m scripts.milestone_w1 \
              --frames 1000 --rate 1000 \
              --max-mean-latency-ms 5.0 &
          SERVER_PID=$!
          # Give the server up to 5 s to bind before connecting.
          for i in 1 2 3 4 5; do
            ss -tln | grep -q ':9000 ' && break
            sleep 1
          done
          ./controller/build/ping_client 127.0.0.1 9000 1000
          wait $SERVER_PID

      - name: Upload plant validation plot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-validation-plot
          path: results/plant_validation_dry_asphalt.png
          if-no-files-found: warn
          retention-days: 14
